<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    
    <!-- Meta-etiquetas para Tablet/Móvil como App Nativa -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#001757" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PROSPECCIÓN OBS" />
    <link rel="apple-touch-icon" href="./logo.png" />
    
    <!-- FUENTE CORPORATIVA MONTSERRAT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">

    <title>PROSPECCIÓN OBS | Control de Obras</title>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased select-none font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- REGISTRO NATIVO DEL SERVICE WORKER PARA CARGA EN FRÍO SIN INTERNET -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((reg) => {
            console.log('✅ Service Worker OBS activado con éxito:', reg.scope);
          }).catch((err) => {
            console.warn('Fallo registrando Service Worker:', err);
          });
        });
      }
    </script>
  </body>
</html>
